name: Recipe v2.7 staging checks
on:
  push:
    branches: [main]
    paths:
      - 'preview/index.html'
      - 'preview/app.js'
      - 'preview/recipe-builder.mjs'
      - 'preview/sw.js'
      - 'preview/manifest.webmanifest'
      - '.github/workflows/recipes-v27-staging.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check preview/app.js
          node --check preview/recipe-builder.mjs
          node --check preview/sw.js
          node --check app.js
          node --check wyszukiwarka.mjs
      - name: Check staging isolation and asset references
        run: node preview/verify-staging.mjs
      - name: Run existing regression tests
        run: npm test
