name: Recipe v2.7 staging checks
on:
  push:
    branches: [main]
    paths:
      - 'preview/index.html'
      - 'preview/app.js'
      - 'preview/recipe-builder.mjs'
      - '.github/workflows/recipes-v27-staging.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check preview/app.js
          node --check preview/recipe-builder.mjs
          node --check app.js
          node --check wyszukiwarka.mjs
      - name: Check staging isolation and asset references
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync, existsSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const html = readFileSync('preview/index.html', 'utf8');
          const app = readFileSync('preview/app.js', 'utf8');
          const recipes = readFileSync('preview/recipe-builder.mjs', 'utf8');
          assert.match(html, /src="\.\/app\.js\?v=2\.7\.0-staging"/);
          assert.match(html, /src="\.\/recipe-builder\.mjs\?v=2\.7\.0-staging"/);
          assert.doesNotMatch(html, /src="\.\.\/pwa-updater\.js/);
          assert.match(app, /moj-bilans-preview-v27/);
          assert.match(app, /moj-bilans-preview-copies-v27/);
          assert.match(app, /recipes: state\.recipes/);
          assert.match(app, /recipes: validateRecipes\(payload\.recipes\)/);
          assert.match(app, /draft\.entries\.push\(entry\)/);
          assert.match(recipes, /searchBasicFoods/);
          assert.match(recipes, /searchFoodCatalog/);
          const paths = [...html.matchAll(/(?:src|href)="(\.\.\/[^"?]+)/g)];
          for (const match of paths) assert.ok(existsSync('preview/' + match[1]), 'Missing asset: ' + match[1]);
          console.log('Staging invariants and asset references passed');
          EOF
      - name: Run existing regression tests
        run: npm test
