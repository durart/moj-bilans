name: PWA stability checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/stabilizacja-2.7.1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check recipe-builder.mjs
          node --check pwa-updater.js
          node --check sw.js
      - name: Run regression tests
        run: npm test
