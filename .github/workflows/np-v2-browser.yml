name: NP v2 — browser acceptance (Stage 5)
on:
  push:
    branches:
      - feature/nutrition-performance-v2
    paths:
      - 'np-v2/**'
      - '.github/workflows/np-v2-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runner (not a runtime dependency)
        run: npm install --no-save --package-lock=false playwright
      - name: Install Chromium and dependencies
        run: npx playwright install --with-deps chromium
      - name: Test isolated app in real Chromium
        run: node np-v2/test_browser_stage5.mjs
      - name: Attach viewport screenshots on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: np-v2-stage5-screenshots
          path: np-v2/test-artifacts/
          if-no-files-found: ignore
          retention-days: 7
