name: Mój Bilans v2.7 production smoke checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'index.html'
      - 'recipe-builder.mjs'
      - 'interfejs-wyszukiwarki.mjs'
      - 'sw.js'
      - '.github/workflows/recipes-v27-production.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check app.js
          node --check recipe-builder.mjs
          node --check interfejs-wyszukiwarki.mjs
          node --check sw.js
      - name: Verify production release invariants
        run: node release-tests/production-smoke.mjs
      - name: Existing regression suite
        if: github.event_name != 'pull_request'
        run: npm test
