name: Mój Bilans - neon app icons

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - feature/moj-bilans-new-icon-both-20261122
      - feature/moj-bilans-android-maskable-test
      - feature/moj-bilans-larger-icons-maskable-v2
    paths:
      - 'icons/icon-neon-large-192.png'
      - 'icons/icon-neon-large-512.png'
      - 'icons/apple-touch-neon-large-180.png'
      - 'icons/favicon-neon-large-48.png'
      - 'icons/icon-neon-192.png'
      - 'icons/icon-neon-512.png'
      - 'icons/icon-maskable-192.png'
      - 'icons/icon-maskable-512.png'
      - 'icons/apple-touch-neon-180.png'
      - 'icons/favicon-neon-48.png'
      - 'manifest.webmanifest'
      - 'np-v2/manifest.webmanifest'
      - 'index.html'
      - 'np-v2/index.html'
      - 'np-v2/nowy.html'
      - 'sw.js'
      - 'np-v2/sw.js'
      - 'test_app_icons.mjs'
      - 'test_*.mjs'
      - '.github/workflows/moj-bilans-icons.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-icons:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build candidate preview
        run: node build-staging.mjs
      - name: Verify PNG files, manifests and isolated offline caches
        run: node test_app_icons.mjs
      - name: Verify existing diary regression suite
        if: github.event_name != 'pull_request'
        run: npm test
      - name: Verify test app structure and history/body regressions
        run: node np-v2/test_np_v2.mjs && node np-v2/test_layout_parity.mjs && node np-v2/test_np_history_24.mjs && node np-v2/test_np_body_25.mjs
